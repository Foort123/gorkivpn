<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GORKIVPN</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Замок: пароль спрашивается один раз на устройство -->
  <div id="lockOverlay" class="lock-overlay hidden">
    <div class="lock-card">
      <img src="logo.png" alt="GORKIVPN" class="lock-logo">
      <span class="brand-title">GORKI<span class="brand-accent">VPN</span></span>
      <p class="lock-hint">Введите пароль доступа. Спросим один раз — дальше вход свободный.</p>
      <input type="password" id="lockInput" placeholder="Пароль" autocomplete="off">
      <div id="lockError" class="lock-error hidden">Неверный пароль</div>
      <button id="lockBtn" class="submit-btn">Войти</button>
    </div>
  </div>

  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">
          <img src="logo.png" alt="GORKIVPN">
        </div>
        <div class="brand-info">
          <span class="brand-title">GORKI<span class="brand-accent">VPN</span></span>
        </div>
      </div>
      <button id="addKeyBtn" class="icon-btn" title="Добавить конфиг / ss:// ключ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </header>

    <!-- Main Visual Connect Stage -->
    <main class="main-stage">
      <div class="connect-ring-container">
        <div class="outer-glow" id="outerGlow"></div>
        <div class="pulse-ring" id="pulseRing"></div>
        <button id="connectBtn" class="connect-circle-btn">
          <div class="power-icon">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
              <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
          </div>
        </button>
      </div>

      <div class="status-label-box">
        <h2 id="statusText" class="status-title">ОТКЛЮЧЕНО</h2>
        <p id="statusSubtext" class="status-subtext">Нажмите на кнопку для защиты соединения</p>
      </div>

      <!-- Realtime Dashboard Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon ping">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
          <div class="stat-details">
            <span class="stat-title">ПИНГ</span>
            <span id="pingValue" class="stat-value">-- ms</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon speed">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </div>
          <div class="stat-details">
            <span class="stat-title">СКОРОСТЬ</span>
            <span id="speedValue" class="stat-value">0.0 KB/s</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Profile Selector Panel -->
    <section class="profile-section">
      <div class="section-header">
        <span>Сервер подключений</span>
        <button id="refreshPingBtn" class="text-btn">Тест пинга</button>
      </div>
      <div id="profileList" class="profile-list">
        <!-- Profiles rendered dynamically -->
      </div>
    </section>

    <!-- Split tunneling: приложения мимо VPN -->
    <section class="profile-section exclude-section">
      <div class="section-header">
        <span>Без VPN <em class="hint">— сбрасывается при перезапуске</em></span>
        <button id="addExcludeBtn" class="text-btn">+ Приложение</button>
      </div>
      <div id="excludeList" class="profile-list exclude-list">
        <!-- Excluded processes rendered dynamically -->
      </div>
    </section>

    <!-- Modal: выбор процесса (в духе Cheat Engine) -->
    <div id="procModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Выберите процесс</h3>
          <button id="closeProcModalBtn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <input type="text" id="procSearch" class="proc-search" placeholder="Поиск по имени или заголовку окна...">
          <div id="procList" class="proc-list"></div>
        </div>
      </div>
    </div>

    <!-- Modal for Adding Key / Config -->
    <div id="addModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Добавить сервер VPN</h3>
          <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="tab-buttons">
            <button id="tabKey" class="tab-btn active">ss:// Ключ / URL</button>
            <button id="tabManual" class="tab-btn">Вручную (Railway)</button>
          </div>

          <form id="keyForm" class="tab-content active">
            <label>Вставьте ss:// ключ Outline / Shadowsocks</label>
            <textarea id="ssUrlInput" placeholder="ss://BASE64(метод:пароль)@somename.proxy.rlwy.net:15525#Railway%20VPN"></textarea>
            <button type="submit" class="submit-btn">Импортировать ключ</button>
          </form>

          <form id="manualForm" class="tab-content">
            <div class="form-group">
              <label>Название</label>
              <input type="text" id="manualName" placeholder="Railway VPN" value="Railway VPN">
            </div>
            <div class="form-group">
              <label>Хост / Сервер (Railway Proxy Domain)</label>
              <input type="text" id="manualServer" placeholder="altaria.proxy.rlwy.net" value="altaria.proxy.rlwy.net">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Порт</label>
                <input type="number" id="manualPort" placeholder="15525" value="15525">
              </div>
              <div class="form-group">
                <label>Шифрование</label>
                <input type="text" id="manualCipher" placeholder="aes-256-gcm" value="aes-256-gcm">
              </div>
            </div>
            <div class="form-group">
              <label>Пароль</label>
              <input type="password" id="manualPassword" placeholder="Ваш PASSWORD из Railway" value="nkpbu-irWFX-snzju-M5WQr-zqQr6">
            </div>
            <button type="submit" class="submit-btn">Сохранить сервер</button>
          </form>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
